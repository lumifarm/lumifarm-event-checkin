<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>報到管理 | 光農合作社</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-emerald-700 text-white px-4 py-3 flex items-center justify-between shadow">
    <a href="index.html" class="font-bold text-lg">🌾 光農合作社</a>
    <div class="flex gap-4 text-sm items-center">
      <a href="index.html" class="hover:underline">活動列表</a>
      <a href="my-tickets.html" class="hover:underline">我的票券</a>
      <a href="checkin.html" class="hover:underline">報到管理</a>
      <button id="btn-login" class="bg-white text-emerald-700 px-3 py-1 rounded-full font-bold">使用 Google 登入</button>
      <div id="nav-user-info" class="hidden items-center gap-2">
        <img id="nav-user-photo" class="w-8 h-8 rounded-full border-2 border-white" />
        <span id="nav-user-name" class="hidden sm:inline"></span>
        <button id="btn-logout" class="underline">登出</button>
      </div>
    </div>
  </nav>

  <main class="max-w-md mx-auto p-4 text-center">
    <h1 class="text-xl font-bold text-gray-800 my-4">現場報到掃描</h1>
    <p id="admin-gate" class="hidden text-gray-500 py-8"></p>
    <div id="scanner-section" class="hidden">
      <div id="qr-reader" class="rounded-lg overflow-hidden shadow"></div>
      <div id="scan-result" class="mt-4"></div>
    </div>
  </main>

  <script type="module" src="js/page-checkin.js"></script>
</body>
</html>

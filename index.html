<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>光農合作社群-活動報名系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen">
  <nav class="site-nav text-white shadow">
    <div class="px-4 py-3 flex items-center justify-between">
      <a href="#/events" class="font-bold text-lg flex items-center gap-2">
        <img src="assets/logo.webp" alt="光農合作社群 logo" class="w-9 h-9 rounded-full border-2 border-amber-200/70 shadow" />
        <span>🌱 光農合作社群-活動報名系統</span>
      </a>
      <button id="nav-toggle" type="button" class="sm:hidden text-2xl leading-none px-2" aria-label="開啟選單" aria-expanded="false">
        &#9776;
      </button>
      <div id="nav-links" class="hidden flex-col items-start gap-3 mt-3 sm:mt-0 sm:flex sm:flex-row sm:items-center sm:gap-4 text-sm w-full sm:w-auto">
        <a href="#/events" data-route="/events" class="hover:underline">活動列表</a>
        <a href="#/tickets" data-route="/tickets" class="hover:underline">我的票券</a>
        <a href="#/checkin" data-route="/checkin" id="nav-link-checkin" class="hidden hover:underline">報到管理</a>
        <a href="#/admin" data-route="/admin" id="nav-link-admin" class="hidden hover:underline">主辦專區</a>
        <a href="#/faq" data-route="/faq" class="hover:underline">常見問題</a>
        <a href="#/onboarding" data-route="/onboarding" class="hover:underline">新手教學</a>
        <a href="https://www.lumifarm.org/" target="_blank" rel="noopener noreferrer" class="hover:underline">🏠 回官網</a>
        <button id="btn-login" class="bg-white text-emerald-800 px-4 py-1.5 rounded-full font-bold shadow hover:shadow-md transition">使用 Google 登入</button>
        <div id="nav-user-info" class="hidden relative items-center gap-2">
          <button id="nav-user-toggle" type="button" class="flex items-center gap-2">
            <img id="nav-user-photo" class="w-8 h-8 rounded-full border-2 border-white" />
            <span id="nav-user-name" class="hidden sm:inline"></span>
          </button>
          <div id="nav-user-menu" class="hidden absolute right-0 top-10 bg-white text-gray-800 rounded-lg shadow-lg py-2 w-40 z-20">
            <a href="#/profile" data-route="/profile" class="block px-4 py-2 text-sm hover:bg-gray-100">資料維護</a>
            <button id="btn-logout" type="button" class="block w-full text-left px-4 py-2 text-sm hover:bg-gray-100">登出</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main id="app" class="p-4"></main>

  <script type="module" src="js/app.js"></script>
</body>
</html>

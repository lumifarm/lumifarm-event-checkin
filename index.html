<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>光農合作社 | 活動報名</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-emerald-700 text-white px-4 py-3 flex items-center justify-between shadow">
    <a href="index.html" class="font-bold text-lg">🌾 光農合作社</a>
    <div class="flex gap-4 text-sm items-center">

      <a href="my-tickets.html" class="hover:underline">我的票券</a>
      <a href="checkin.html" class="hover:underline">報到管理</a>

        <img id="nav-user-photo" class="w-8 h-8 rounded-full border-2 border-white" />

  <main class="max-w-5xl mx-auto p-4">
    <h1 class="text-2xl font-bold text-gray-800 my-4">近期活動</h1>
    <div id="event-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

  <script type="module" src="js/page-index.js"></script>

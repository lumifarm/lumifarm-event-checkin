<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>光農合作社群-活動報名系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-emerald-700 text-white shadow">
    <div class="px-4 py-3 flex items-center justify-between">
      <a href="#/events" class="font-bold text-lg flex items-center gap-2">
        <img src="assets/logo.webp" alt="光農合作社群 logo" class="w-8 h-8 rounded-full" />
        <span>光農合作社群-活動報名系統</span>
      </a>
      <button id="nav-toggle" type="button" class="sm:hidden text-2xl leading-none px-2" aria-label="開啟選單" aria-expanded="false">
        &#9776;
      </button>
      <div id="nav-links" class="hidden flex-col items-start gap-3 mt-3 sm:mt-0 sm:flex sm:flex-row sm:items-center sm:gap-4 text-sm w-full sm:w-auto">
        <a href="#/events" data-route="/events" class="hover:underline">活動列表</a>
        <a href="#/tickets" data-route="/tickets" class="hover:underline">我的票券</a>
        <a href="#/checkin" data-route="/checkin" id="nav-link-checkin" class="hidden hover:underline">報到管理</a>
        <a href="#/admin" data-route="/admin" id="nav-link-admin" class="hidden hover:underline">主辦專區</a>
        <a href="#/faq" data-route="/faq" class="hover:underline">常見問題</a>
        <a href="#/onboarding" data-route="/onboarding" class="hover:underline">新手教學</a>
        <button id="btn-login" class="bg-white text-emerald-700 px-3 py-1 rounded-full font-bold">使用 Google 登入</button>
        <div id="nav-user-info" class="hidden items-center gap-2">
          <img id="nav-user-photo" class="w-8 h-8 rounded-full border-2 border-white" />
          <span id="nav-user-name" class="hidden sm:inline"></span>
          <button id="btn-logout" class="underline">登出</button>
        </div>
      </div>
    </div>
  </nav>

  <main id="app" class="p-4"></main>

  <script type="module" src="js/app.js"></script>
</body>
</html>

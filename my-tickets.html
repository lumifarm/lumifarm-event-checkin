<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的票券 | 光農合作社</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-emerald-700 text-white px-4 py-3 flex items-center justify-between shadow">
    <a href="index.html" class="font-bold text-lg">🌾 光農合作社</a>
    <div class="flex gap-4 text-sm items-center">
      <a href="index.html" class="hover:underline">活動列表</a>
      <a href="my-tickets.html" class="hover:underline">我的票券</a>
      <a href="checkin.html" class="hover:underline">報到管理</a>
      <button id="btn-login" class="bg-white text-emerald-700 px-3 py-1 rounded-full font-bold">使用 Google 登入</button>
      <div id="nav-user-info" class="hidden items-center gap-2">
        <img id="nav-user-photo" class="w-8 h-8 rounded-full border-2 border-white" />
        <span id="nav-user-name" class="hidden sm:inline"></span>
        <button id="btn-logout" class="underline">登出</button>
      </div>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto p-4">
    <p id="login-prompt" class="hidden text-center text-gray-500 py-16">請先使用 Google 登入以查看你的個人中心與票券。</p>

    <section id="profile-section" class="hidden mb-8"></section>

    <h2 class="text-xl font-bold text-gray-800 mb-3">我的票券</h2>
    <div id="ticket-list" class="hidden space-y-4"></div>
  </main>

  <script type="module" src="js/page-profile.js"></script>
</body>
</html>
